backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: images

locale: en

collections:
  - name: site
    label: Site photos
    files:
      - name: photos
        label: All photos
        file: content/site.json
        format: json
        fields:
          - name: cards
            label: "1. Product cards (main page)"
            widget: object
            fields:
              - { name: wallpaper, label: "N01 - Self-adhesive wallpaper", widget: image }
              - { name: acoustic,  label: "N02 - Acoustic panels",         widget: image }
              - { name: lvt,       label: "N03 - LVT flooring",            widget: image }
              - { name: panels3d,  label: "N04 - 3D panels",               widget: image }

          - name: album
            label: "2. Photo album (gallery)"
            widget: object
            fields:
              - name: wp
                label: "Wallpaper tab"
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: "Model code (e.g. BS-8013)", widget: string, required: false }
              - name: ac
                label: "Acoustic panels tab"
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: Model code, widget: string, required: false }
              - name: lvt
                label: "LVT flooring tab"
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: "Model code (e.g. YSD-3040)", widget: string, required: false }
              - name: td
                label: "3D panels tab"
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: Model code, widget: string, required: false }

          - name: about
            label: "3. About page - factory and team photos"
            widget: object
            required: false
            fields:
              - { name: production,   label: "Production floor",  widget: image, required: false }
              - { name: container,    label: "Container loading", widget: image, required: false }
              - { name: clients,      label: "Client visits",     widget: image, required: false }
              - { name: team,         label: "Our team",          widget: image, required: false }
              - { name: teambuilding, label: "Team building",     widget: image, required: false }
              - { name: warehouse,    label: "Warehouse",         widget: image, required: false }
