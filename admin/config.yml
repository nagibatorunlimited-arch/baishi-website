backend:
  name: github
  repo: nagibatorunlimited-arch/baishi-website
  branch: main

media_folder: images
public_folder: images

locale: en

collections:
  - name: site
    label: Site photos
    files:
      - name: photos
        label: All photos
        file: content/site.json
        format: json
        fields:
          - name: cards
            label: 1. Product cards (main page)
            widget: object
            fields:
              - { name: wallpaper, label: "N°01 — Self-adhesive wallpaper", widget: image }
              - { name: acoustic,  label: "N°02 — Acoustic panels", widget: image }
              - { name: lvt,       label: "N°03 — LVT flooring",           widget: image }
              - { name: panels3d,  label: "N°04 — 3D panels",           widget: image }

          - name: album
            label: 2. Photo album (gallery)
            widget: object
            fields:
              - name: wp
                label: Tab: Wallpaper
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: "Model code (BS-8013)", widget: string, required: false }
              - name: ac
                label: Tab: Acoustic panels
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: Model code, widget: string, required: false }
              - name: lvt
                label: Tab: LVT flooring
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: "Model code (YSD-3040)", widget: string, required: false }
              - name: td
                label: Tab: 3D panels
                widget: list
                summary: "{{fields.code}}"
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: code,  label: Model code, widget: string, required: false }

          - name: about
            label: 3. About page — factory & team photos
            widget: object
            required: false
            fields:
              - { name: production,   label: "Production floor",  widget: image, required: false }
              - { name: container,    label: "Container loading",   widget: image, required: false }
              - { name: clients,      label: "Client visits",   widget: image, required: false }
              - { name: team,         label: "Our team",               widget: image, required: false }
              - { name: teambuilding, label: "Team building",            widget: image, required: false }
              - { name: warehouse,    label: "Warehouse",     widget: image, required: false }